<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#131313;overflow:hidden;

.glow{position:absolute;top:-260px;right:-200px;width:720px;height:720px;border-radius:50%;
 background:radial-gradient(circle,rgba(220,253,80,.13) 0%,rgba(220,253,80,0) 68%)}
.bar{position:absolute;left:0;top:0;width:100%;height:7px;background:#dcfd50}
.pad{position:absolute;inset:0;padding:72px 78px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:20px}
.top img{width:82px;height:82px;border-radius:50%;display:block}
.nm{font-size:23px;font-weight:700;letter-spacing:-.01em}
.rl{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#8e8e8e;
 letter-spacing:.13em;text-transform:uppercase;margin-top:5px}
h1{font-size:82px;font-weight:900;letter-spacing:-.035em;line-height:1.08}
h1 .hl{color:#dcfd50}
.en{font-size:26px;font-weight:700;color:#9d9d9d;letter-spacing:.01em;margin-top:16px}
.mid{margin-top:-6px}
.lede{font-size:23px;color:#9d9d9d;line-height:1.6;max-width:830px;margin-top:20px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.pipe{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:#8e8e8e;letter-spacing:.14em}
.tags{display:flex;gap:9px}
.tag{border:1px solid #2f2f2f;background:#1c1c1c;border-radius:8px;padding:9px 15px;font-size:15px;color:#ededed}
.tag b{color:#dcfd50;font-weight:700}
</style></head><body>
